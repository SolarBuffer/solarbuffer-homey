<?xml version="1.0" encoding="UTF-8"?>
<!--
  Homey toont dit icoon als silhouet en kleurt het zelf in, dus het moet uit
  echte vormen bestaan. Een ingesloten bitmap wordt een leeg vlak.
  Het beeld volgt het app-icoon: een zon die in een boiler druppelt.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <g fill="currentColor">
    <!-- zon -->
    <circle cx="128" cy="62" r="30"/>
    <!-- stralen -->
    <rect x="122" y="6" width="12" height="20" rx="6"/>
    <rect x="122" y="98" width="12" height="16" rx="6"/>
    <rect x="66" y="56" width="20" height="12" rx="6"/>
    <rect x="170" y="56" width="20" height="12" rx="6"/>
    <rect x="80" y="18" width="12" height="20" rx="6" transform="rotate(-45 86 28)"/>
    <rect x="164" y="18" width="12" height="20" rx="6" transform="rotate(45 170 28)"/>
    <rect x="80" y="86" width="12" height="20" rx="6" transform="rotate(45 86 96)"/>
    <rect x="164" y="86" width="12" height="20" rx="6" transform="rotate(-45 170 96)"/>
    <!-- boiler -->
    <rect x="72" y="136" width="112" height="104" rx="16"/>
  </g>
</svg>
